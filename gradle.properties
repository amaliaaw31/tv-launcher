# JVM args and daemon mode are managed by the build environment
# (~/workspace/tools/build-env.sh + ~/.gradle/gradle.properties): this VM
# blocks loopback TCP, so Gradle and Kotlin must compile in-process.
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official
